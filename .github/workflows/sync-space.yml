name: Sync to Hugging Face Space

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to Hugging Face Space
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git remote add space "https://deric254:${{ secrets.HF_TOKEN }}@huggingface.co/spaces/deric254/dericbi-analytics"
          git push --force space HEAD:main
          echo "Live at https://huggingface.co/spaces/deric254/dericbi-analytics"