name: Build and Release DericBI Desktop Installer

# Runs on EVERY push to main (and manually). Each run gets its own
# version number automatically: 1.0.<run number>. The number is set at
# build time only, so nothing is committed back to the repo and there is
# no risk of a build loop.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write   # required for electron-builder to create the Release

concurrency:
  group: desktop-build
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: desktop
        run: npm install

      - name: Set version from run number
        working-directory: desktop
        run: npm version "1.0.${{ github.run_number }}" --no-git-tag-version --allow-same-version

      - name: Build and publish to GitHub Releases
        working-directory: desktop
        run: npm run publish:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
