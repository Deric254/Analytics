name: Build and Release DericBI Desktop Installer

# Runs on EVERY push to main (and manually). Each run gets its own
# version number automatically: 1.0.<run number>.
# This version uses NO third-party "uses:" actions (no actions/checkout,
# no actions/setup-node), so it works even when the repo restricts which
# actions are allowed. It uses plain git and the Node already installed
# on the Windows runner.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: desktop-build
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: windows-latest

    steps:
      - name: Checkout repository (plain git)
        shell: bash
        env:
          GH_PAT: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init .
          git remote add origin "https://x-access-token:${GH_PAT}@github.com/${{ github.repository }}.git"
          git fetch --depth 1 origin "${{ github.sha }}"
          git checkout FETCH_HEAD

      - name: Show Node version
        run: node --version

      - name: Install dependencies
        working-directory: desktop
        run: npm install

      - name: Set version from run number
        working-directory: desktop
        run: npm version "1.0.${{ github.run_number }}" --no-git-tag-version --allow-same-version

      - name: Build and publish to GitHub Releases
        working-directory: desktop
        run: npm run publish:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
